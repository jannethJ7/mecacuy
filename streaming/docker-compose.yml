services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mecacuy-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554/tcp"   # RTSP
      - "8888:8888/tcp"   # HLS
      - "8889:8889/tcp"   # WebRTC signaling / HTTP
      - "8189:8189/udp"   # WebRTC media
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
